name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      run_integration:
        description: 'Run the live Supabase integration suite (requires TOGO_TEST_* secrets on a disposable project)'
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: 22

jobs:
  # Website (info site + operations console) and shared rules: typecheck, lint,
  # unit/adapter tests, production build (which also generates the hosted privacy /
  # terms / delete-account pages).
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit + adapter tests
        run: npm test
      - name: Build (web + legal pages)
        run: npm run build
      - name: Site, console and legal pages exist
        run: |
          test -s dist/index.html && test -s dist/console/index.html
          test -s dist/legal/privacy.html && test -s dist/legal/terms.html && test -s dist/legal/delete-account.html

  # Mobile apps (ToGo and ToGo Staff): typecheck, lint, tests, Expo Doctor, and a
  # release bundle export of each store app for iOS and Android (no device needed).
  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/mobile/package-lock.json
      # The mobile app compiles the shared ../../src modules (via @shared/*), which
      # import @supabase/supabase-js from the repo-root node_modules.
      - name: Install root deps (shared src)
        run: npm ci
      - name: Install mobile deps
        working-directory: apps/mobile
        run: npm ci
      - name: Typecheck
        working-directory: apps/mobile
        run: npm run typecheck
      - name: Lint
        working-directory: apps/mobile
        run: npm run lint
      - name: Tests
        working-directory: apps/mobile
        run: npm test
      - name: Expo Doctor
        working-directory: apps/mobile
        run: npx expo-doctor
      - name: Store config (both apps)
        working-directory: apps/mobile
        run: |
          for v in passenger staff; do
            EXPO_PUBLIC_APP_VARIANT=$v npx expo config --type public --json > "config-$v.json"
            node -e '
              const c = require("./config-" + process.argv[1] + ".json");
              const fail = (m) => { console.error("::error::" + process.argv[1] + ": " + m); process.exit(1); };
              if (!c.version) fail("missing version");
              if (c.ios?.supportsTablet !== false) fail("iPad support must stay off unless iPad screenshots are added");
              if (c.ios?.infoPlist?.ITSAppUsesNonExemptEncryption !== false) fail("export compliance key missing");
              if (!c.ios?.privacyManifests) fail("iOS privacy manifest missing");
              const blocked = c.android?.blockedPermissions ?? [];
              if (!blocked.includes("android.permission.ACCESS_BACKGROUND_LOCATION")) fail("background location must be blocked");
              if (process.argv[1] === "passenger" && !blocked.includes("android.permission.CAMERA")) fail("passenger app must not request the camera");
              console.log(process.argv[1] + ": " + c.name + " " + c.version + " (" + c.ios.bundleIdentifier + ") ok");
            ' "$v"
          done
      - name: Release bundle export (both apps, iOS + Android)
        working-directory: apps/mobile
        run: |
          for v in passenger staff; do
            EXPO_PUBLIC_APP_VARIANT=$v npx expo export --platform ios --platform android --output-dir "dist-$v"
          done
      - name: No preview wording in release bundles
        working-directory: apps/mobile
        run: |
          if grep -rlaE "\b(pilot|illustrative|lorem ipsum)\b" dist-passenger dist-staff --include=*.hbc --include=*.js; then
            echo "::error::Release bundle contains pre-launch wording"; exit 1
          fi

  # End-to-end: Playwright drives the real app screens (web build, preview mode)
  # through the passenger journey, each crew workspace, and a passenger boarded by
  # the conductor. Native-only parts (camera, push, maps SDK) aren't covered.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/mobile/package-lock.json
      - name: Install root deps (shared src)
        run: npm ci
      - name: Install mobile deps
        working-directory: apps/mobile
        run: npm ci
      - name: Install Chromium
        working-directory: apps/mobile
        run: npx playwright install --with-deps chromium
      - name: Build web previews (ToGo, ToGo Staff, combined)
        working-directory: apps/mobile
        run: npm run e2e:build
      - name: End-to-end tests
        working-directory: apps/mobile
        run: npm run e2e
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: apps/mobile/e2e/report
          retention-days: 7

  # Real PostgreSQL: RLS/transaction suite + concurrency race. The auth shim
  # (supabase/tests/00_shim.sql) is test-only infrastructure and is never part of
  # the migrations applied to a real project.
  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      PSQL: psql
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v7
      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: RLS + transaction suite
        run: bash supabase/tests/run.sh
      - name: Concurrency race
        run: bash supabase/tests/concurrency.sh

  # Live Supabase Auth + PostgREST + Realtime. OPT-IN only: runs on manual dispatch
  # with run_integration=true, and only when the TOGO_TEST_* secrets are configured
  # against a DISPOSABLE test project. Never provide a service-role key here — the
  # suite uses only the public anon key and per-user passwords.
  integration:
    if: github.event_name == 'workflow_dispatch' && inputs.run_integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Supabase integration (two sessions)
        env:
          TOGO_TEST_SUPABASE_URL: ${{ secrets.TOGO_TEST_SUPABASE_URL }}
          TOGO_TEST_SUPABASE_ANON_KEY: ${{ secrets.TOGO_TEST_SUPABASE_ANON_KEY }}
          TOGO_TEST_PASSENGER_EMAIL: ${{ secrets.TOGO_TEST_PASSENGER_EMAIL }}
          TOGO_TEST_PASSENGER_PASSWORD: ${{ secrets.TOGO_TEST_PASSENGER_PASSWORD }}
          TOGO_TEST_PASSENGER2_EMAIL: ${{ secrets.TOGO_TEST_PASSENGER2_EMAIL }}
          TOGO_TEST_PASSENGER2_PASSWORD: ${{ secrets.TOGO_TEST_PASSENGER2_PASSWORD }}
          TOGO_TEST_CONDUCTOR_EMAIL: ${{ secrets.TOGO_TEST_CONDUCTOR_EMAIL }}
          TOGO_TEST_CONDUCTOR_PASSWORD: ${{ secrets.TOGO_TEST_CONDUCTOR_PASSWORD }}
          TOGO_TEST_OTHER_STAFF_EMAIL: ${{ secrets.TOGO_TEST_OTHER_STAFF_EMAIL }}
          TOGO_TEST_OTHER_STAFF_PASSWORD: ${{ secrets.TOGO_TEST_OTHER_STAFF_PASSWORD }}
          TOGO_TEST_TRIP_ID: ${{ secrets.TOGO_TEST_TRIP_ID }}
          TOGO_TEST_PICKUP_STOP_ID: ${{ secrets.TOGO_TEST_PICKUP_STOP_ID }}
          TOGO_TEST_DROPOFF_STOP_ID: ${{ secrets.TOGO_TEST_DROPOFF_STOP_ID }}
          TOGO_TEST_COMPLETABLE_TRIP_ID: ${{ secrets.TOGO_TEST_COMPLETABLE_TRIP_ID }}
        run: npm run test:integration
