# Supabase local development configuration for the ToGo pilot.
# Used by the Supabase CLI (`supabase start`, `supabase db reset`).
project_id = "togo-pilot"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
# Local dev site URL; add your deployed URL(s) to additional_redirect_urls.
site_url = "http://localhost:5173"
# exp://** is for Expo Go during development only; never add it in production.
additional_redirect_urls = ["http://localhost:5173/**", "togo://**", "togostaff://**", "exp://**"]
# Access tokens last an hour; the apps refresh them while open.
jwt_expiry = 3600
# Each refresh token works once; a stolen one that's reused is detected and the
# whole session is ended. 10 s of grace for two requests racing.
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
enable_manual_linking = false
# NIST SP 800-63B: length, not composition rules. The apps check the same rules
# and refuse common passwords (src/lib/authRules.ts). In production also turn on
# leaked-password protection (Pro plan; see docs/DEPLOYMENT.md).
minimum_password_length = 8
password_requirements = ""

# Per IP address. Sign-in and sign-up attempts and code checks per 5 minutes
# slow down password guessing and code guessing.
[auth.rate_limit]
email_sent = 30
sign_in_sign_ups = 30
token_verifications = 30
token_refresh = 150

[auth.email]
enabled = true
# Accounts must confirm their email before they can sign in. Locally the emails
# land in the local mailbox ([local_smtp] below).
enable_confirmations = true
# An email change is confirmed from both the old and the new address.
double_confirm_changes = true
# Changing a password needs a recent sign-in (the apps also ask for the current
# password first).
secure_password_change = true
# One confirmation or reset email per address per minute.
max_frequency = "60s"
# Codes in confirmation and reset emails: 8 digits, valid 30 minutes, one use.
otp_length = 8
otp_expiry = 1800

[auth.email.template.confirmation]
subject = "Your ToGo confirmation code"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Reset your ToGo password"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.email_change]
subject = "Confirm your new ToGo email"
content_path = "./supabase/templates/email_change.html"

# Security notices: the account owner hears about these even if someone else did them.
[auth.email.notification.password_changed]
enabled = true
subject = "Your ToGo password was changed"
content_path = "./supabase/templates/password_changed.html"

[auth.email.notification.email_changed]
enabled = true
subject = "Your ToGo email address was changed"
content_path = "./supabase/templates/email_changed.html"

# Local mailbox for sign-up and reset emails: http://localhost:54324
[local_smtp]
enabled = true
port = 54324

[realtime]
enabled = true
