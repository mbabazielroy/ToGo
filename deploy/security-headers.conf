# Security headers for every response. nginx drops server-level add_header lines
# in any location that sets its own, so each location in nginx.conf includes this.
#
# CSP: scripts only from this site; data only from this site and Supabase (change
# *.supabase.co if the project uses a custom domain); inline styles are allowed
# for the static legal pages. Nothing may frame the site.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://*.supabase.co wss://*.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
# Only sent over HTTPS (the TLS proxy in front of this container passes it on).
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
