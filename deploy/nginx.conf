# nginx config for the ToGo single-page app. SPA fallback keeps client-side routes
# (e.g. /staff/driver, /trips/:id) working on refresh and deep links; hashed assets
# are cached hard, index.html is never cached so new deploys are picked up.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Long-cache fingerprinted assets.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Never cache the entry document.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # SPA fallback: unknown paths serve index.html so React Router can handle them.
  location / {
    try_files $uri $uri/ /index.html;
  }

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
