# nginx config for the ToGo website: the public info page (/), the operations
# console (/console, a single-page app with its own routes) and the static legal
# pages (/legal/*.html). Hashed assets are cached hard; HTML is never cached so new
# deploys are picked up.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Security headers: included in every location, because a location that sets
  # any header of its own stops inheriting the server-level ones.
  include /etc/nginx/togo-security-headers.conf;

  # Long-cache fingerprinted assets.
  location /assets/ {
    expires 1y;
    include /etc/nginx/togo-security-headers.conf;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Operations console: its routes (e.g. /console/operator) all load its page.
  location /console {
    include /etc/nginx/togo-security-headers.conf;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /console/index.html;
  }

  # Public site and legal pages. Unknown paths show the home page.
  location / {
    include /etc/nginx/togo-security-headers.conf;
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
